{% load core_extras %}
<article class="card listing-card h-100">
  <div class="card-body d-flex gap-3">
    {% include 'catalog/includes/book_cover.html' %}
    <div class="d-flex flex-column flex-grow-1 min-w-0">
      <h2 class="h6 card-title mb-1"><a href="{{ book.get_absolute_url }}">{{ book.title }}</a></h2>
      <p class="card-text text-body-secondary small mb-2">{{ book.author }} &middot; {{ book.genre }}</p>
      <p class="card-text small mb-auto">
        {% include 'catalog/includes/condition_badge.html' %}
        <span class="text-body-secondary">from {{ book.posted_by.get_username }}</span>
      </p>
      <div class="d-flex justify-content-between align-items-center gap-2 mt-2">
        <small class="text-body-secondary">or buy for {{ book.price|currency }}</small>
        <a href="{% url 'trading:propose' book.id %}" class="btn btn-sm btn-primary">Offer a swap</a>
      </div>
    </div>
  </div>
</article>
